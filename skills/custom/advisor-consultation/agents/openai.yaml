interface:
  display_name: "Advisor Consultation"
  short_description: "Use Astra for high-impact decisions and validation checkpoints"
  default_prompt: "Establish cheap facts first, verify the impact gate and a judgment or validation reason, spawn one fresh advisor for the checkpoint, support bounded clarification dialogue in that consultation, return the final advice to the root, and close the advisor."

policy:
  allow_implicit_invocation: true
